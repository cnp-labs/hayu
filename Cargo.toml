[package]
name = "hayu"
version = "0.1.0"
edition = "2024"
description = "Hayu desktop shell prototype (M0)"

[dependencies]
calloop = { version = "0.14", features = ["signals"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cosmic-text = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = { version = "0.21", features = ["calloop"] }
tiny-skia = "0.12"
toml = "1"
wayland-client = "0.31"
