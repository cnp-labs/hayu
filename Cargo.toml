[package]
name = "hayu"
version = "0.1.0"
edition = "2024"
description = "Hayu desktop shell prototype (M0)"
license = "MIT"

[features]
default = []
gpu-spike = ["dep:libc", "dep:tiny-skia"]
wgpu = ["gpu-spike", "dep:wgpu", "dep:pollster"]

[dependencies]
glutin = { version = "0.32.3", default-features = false, features = ["egl", "wayland"] }
glow = "0.18.0"
pollster = { version = "1.0.1", optional = true }
raw-window-handle = "0.6.2"
wgpu = { version = "30.0.1", optional = true, default-features = false, features = ["std", "vulkan", "wgsl"] }
calloop = { version = "0.14", features = ["signals"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cosmic-text = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = { version = "0.21", features = ["calloop"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"], optional = true }
libc = { version = "0.2", optional = true }
toml = "1"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
xkbcommon = "0.8"
accesskit = "0.25"
accesskit_unix = "0.24"
zbus = { version = "5", default-features = false, features = ["async-io"] }
async-channel = "2"
futures-lite = "2"
png = "0.18"

[dev-dependencies]
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[[bin]]
name = "hayu-gpu-spike"
path = "src/bin/gpu_spike.rs"
required-features = ["gpu-spike"]
